<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vídeo — Arquitetura da Presença Digital</title>
  <meta name="description" content="Vídeo liberado e contato direto no WhatsApp." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <section class="hero">
      <div class="hero-content">
        <p class="eyebrow">Acesso liberado</p>
        <h1>Assista ao vídeo completo.</h1>
        <p class="subtitle">
          Aqui está o conteúdo liberado. Se quiser continuar direto comigo, o WhatsApp está disponível.
        </p>
        <div class="cta-card">
          <div class="video-frame">
            <iframe
              src="https://www.youtube.com/embed/VIDEO_ID"
              title="Vídeo Arquitetura da Presença Digital"
              frameborder="0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen
            ></iframe>
          </div>
          <div class="actions">
            <a class="secondary whatsapp" id="whatsapp-link" href="#" target="_blank" rel="noopener">
              Continuar no WhatsApp
            </a>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script src="video.js"></script>
</body>
</html>
