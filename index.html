<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Arquitetura da Presença Digital</title>
  <meta name="description" content="Uma experiência premium para iniciar sua presença digital com clareza." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <section class="hero">
      <div class="hero-content">
        <p class="eyebrow">Mapa Interativo — Arquitetura da Presença Digital</p>
        <h1>Presença digital com elegância, ritmo e intenção.</h1>
        <p class="subtitle">
          Digite seu e-mail para desbloquear o vídeo completo e o contato direto no WhatsApp.
        </p>
        <div class="neon-counter" id="neon-counter" aria-live="polite"></div>
        <div class="cta-card">
          <div class="thumbnail" id="thumbnail">
            <img src="assets/thumbnail.png" alt="Thumbnail do vídeo" loading="lazy" />
            <span class="badge">Prévia exclusiva</span>
          </div>
          <div class="email-form" id="email-form">
            <label for="email-input">Seu e-mail</label>
            <input id="email-input" name="email" type="email" placeholder="voce@email.com" required />
            <button type="button" class="primary" id="watch-button">Assistir vídeo</button>
            <p class="helper" id="email-helper">Sem spam. Apenas o acesso e a próxima etapa.</p>
          </div>
          <div class="status" id="status" aria-live="polite"></div>
        </div>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
